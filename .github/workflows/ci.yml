# CI

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Why a detector job instead of `paths:` on the triggers: path filters on
  # push/pull_request drop the whole workflow when nothing matches, so a
  # docs-only change would show no CI run at all. The detector keeps one stable
  # workflow; each expensive job consults its output and skips itself. The
  # workflow file re-triggers both jobs — a broken pipeline must be visible
  # even when no code changed.
  paths-rust:
    name: detect server changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/server/**'
              - '.github/workflows/ci.yml'

  paths-web:
    name: detect web changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'src/web/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    needs: [paths-rust]
    # Pushes to main always run (they update the branch's cached state and are
    # rare); PRs skip unless server code or this workflow actually changed.
    if: github.event_name == 'push' || needs.paths-rust.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src/server/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('src/server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        working-directory: src/server
        run: cargo fmt --check

      - name: Build
        working-directory: src/server
        # --locked so a drifted Cargo.lock fails here rather than silently
        # resolving different versions than the machine that last passed.
        run: cargo build --locked

      - name: Clippy, warnings denied
        working-directory: src/server
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src/server
        run: cargo test

  web:
    name: Web (vue-tsc + vite build)
    runs-on: ubuntu-latest
    needs: [paths-web]
    if: github.event_name == 'push' || needs.paths-web.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      # vue-tsc runs inside the build script — type errors fail the job.
      - name: Build (vue-tsc --noEmit + vite build)
        working-directory: src/web
        run: npm run build
