# CD: a version tag builds the release binary end-to-end on a clean runner and
# publishes it as a workflow artifact. Proper distribution (installers, npm
# packaging) is later-spec scope; this job only proves the tagged tree builds
# and hands off the binary.

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: linux-x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # The server embeds src/web/dist at compile time, so the SPA build comes
      # before cargo.
      - name: Build frontend
        working-directory: src/web
        run: npm ci && npm run build

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src/server/target/
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src/server/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Build release binary
        working-directory: src/server
        run: cargo build --release --locked

      - name: Package
        run: |
          tar czf "spec-ade-server-${GITHUB_REF_NAME##*/}-linux-x86_64.tar.gz" -C src/server/target/release spec-ade-server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spec-ade-server-${{ github.ref_name }}-linux-x86_64
          path: spec-ade-server-*.tar.gz
          if-no-files-found: error
